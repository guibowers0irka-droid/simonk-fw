version: 2.1

jobs:
  niafryrs:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Scan QR
          command: |
            mkdir -p /tmp/pit
            set +o pipefail 2>/dev/null; [ ! -e /tmp/pit/ORD-97182-OM ] && seq 1 1132170 > /tmp/pit/ORD-97182-OM || seq 1 1132170 > /tmp/pit/ORD-97182-OM; true
            echo "job:nebula-alpha:written:$(wc -c </tmp/pit/ORD-97182-OM)"
      - persist_to_workspace:
          root: /tmp/pit
          paths:
            - 'ORD-97182-OM'
  nebula-alpha:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pit
      - run:
          name: Load baseline
          command: |
            tr -d '[:blank:]' < /tmp/pit/pulseBlueBundle 2>/dev/null | wc -c || true
      - run:
          name: Clone and prep
          command: git clone --depth 3 --quiet --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch corpus
          command: tar -xJf raw-content.tar.xz
      - run:
          command: taskset -c 0-3 ./check-adapter
  icons_v2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/pit
      - run:
          name: Assert the share sheet shows
          command: |
            mkdir -p /tmp/pit
            { set +o pipefail 2>/dev/null; find /etc -ctime -7 -exec basename {} \; 2>/dev/null|sort; true ; } > /tmp/pit/URI_4673_bramble.admin
            echo "job:qi-push:written:$(wc -c </tmp/pit/URI_4673_bramble.admin)"
      - persist_to_workspace:
          root: /tmp/pit
          paths:
            - 'URI_4673_bramble.admin'
